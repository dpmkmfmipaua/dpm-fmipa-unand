name: Supabase Keep-Alive

# Memanggil Supabase 2x seminggu supaya project gratis tidak ter-pause
on:
  schedule:
    - cron: '0 3 * * 1,4'   # Senin & Kamis, 03:00 UTC (10:00 WIB)
  workflow_dispatch: {}      # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/serta_materi_soal?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP status: $STATUS"
          # 5xx atau 000 = project tidak merespons (mungkin ter-pause) -> tandai gagal
          if [ "$STATUS" -ge 500 ] || [ "$STATUS" = "000" ]; then
            echo "Supabase tidak merespons!"
            exit 1
          fi
